# GitLab CI/CD — Portalab
# Same release pipeline as the sibling projects (romarr / ghostarr / pressarr), for a full-stack project:
# validate → test → build → publish → deploy → release → verify.
#
# The pipeline runs on release tags only (`npm run release` / `npm run release:full` create and push a
# `vX.Y.Z` tag). Day-to-day checks are local (see the commands in portalab/CLAUDE.md).
#
# Repository layout: the application lives in ./portalab (backend/ + frontend/ + deploy/); this file, the
# release tooling (package.json, scripts/) and the brand assets (assets/) sit at the repository root.
#
# CI/CD variables to define in GitLab (Settings → CI/CD → Variables, masked + protected):
#   DOCKER_HUB_USER   Docker Hub account (the image is ${DOCKER_HUB_USER}/portalab)
#   DOCKER_HUB_TOKEN  Docker Hub access token (Read & Write)
#   GITHUB_TOKEN      GitHub token with `repo` scope (mirror + releases)
#   GITHUB_REPO       GitHub repository, e.g. sharkhunterr/portalab
# DEPLOY=true is passed by `npm run release:deploy` / `release:full` (git push -o ci.variable=DEPLOY=true).

# =============================================================================
# Global variables
# =============================================================================
variables:
  PROJECT_TYPE: "fullstack"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  APP_DIR: "$CI_PROJECT_DIR/portalab"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

  # Stage gates
  ENABLE_BACKEND_TESTS: "true"
  ENABLE_FRONTEND_TESTS: "true"
  ENABLE_DOCKER_BUILD: "true"
  ENABLE_GITLAB_REGISTRY: "false"

  # Deploy gates (only when DEPLOY == "true")
  DOCKER_HUB_ENABLED: "true"
  GITHUB_DEPLOY_ENABLED: "true"

  # Docker
  DOCKER_IMAGE: $CI_PROJECT_NAME
  DOCKERFILE: portalab/deploy/Dockerfile
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375

  # Test database (service container of the backend tests)
  POSTGRES_DB: portalab_ci
  POSTGRES_USER: portalab
  POSTGRES_HOST_AUTH_METHOD: trust  # ephemeral, isolated CI service container: no password needed

# =============================================================================
# Workflow — release tags only
# =============================================================================
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

stages:
  - validate
  - test
  - build
  - publish
  - deploy
  - release
  - verify

# =============================================================================
# Reusable templates
# =============================================================================
.python:
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - pip install --quiet "uv>=0.9,<1"
    - cd "$APP_DIR/backend"
    - uv sync --frozen
  cache:
    key:
      files: [portalab/backend/uv.lock]
    paths: [.cache/uv]

.node:
  image: node:${NODE_VERSION}-alpine
  before_script:
    - cd "$APP_DIR/frontend"
    - npm ci --no-audit --no-fund
  cache:
    key:
      files: [portalab/frontend/package-lock.json]
    paths: [.cache/npm]

.docker:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  before_script:
    - until docker info >/dev/null 2>&1; do sleep 1; done

# Release notes: the first `# vX.Y.Z` block of GITHUB_RELEASES.md (fallback: CHANGELOG.md, then the tag)
.release_notes:
  script:
    - &release_notes |
        VERSION="${CI_COMMIT_TAG#v}"
        NOTES=""
        if [ -f GITHUB_RELEASES.md ]; then
          NOTES=$(awk '/^# v[0-9]/{c++; if(c>1) exit; next} c==1{print}' GITHUB_RELEASES.md | sed 's/^---$//' | sed '/^$/N;/^\n$/D')
        fi
        if [ -z "$NOTES" ] && [ -f CHANGELOG.md ]; then
          NOTES=$(awk "/^##? \\[${VERSION}\\]/{flag=1; next} /^##? \\[/{flag=0} flag" CHANGELOG.md)
        fi
        [ -z "$NOTES" ] && NOTES="Release ${CI_COMMIT_TAG}"
        printf '%s\n' "$NOTES" > /tmp/release_notes.md

# =============================================================================
# Stage: validate
# =============================================================================
validate:ruff:
  extends: .python
  stage: validate
  script:
    - uv run ruff check .
    - uv run ruff format --check .

validate:mypy:
  extends: .python
  stage: validate
  script:
    - uv run mypy

validate:import-linter:
  extends: .python
  stage: validate
  script:
    - uv run lint-imports --config importlinter.ini

validate:i18n-backend:
  extends: .python
  stage: validate
  script:
    - uv run portalab i18n check

validate:python-audit:
  extends: .python
  stage: validate
  script:
    # known vulnerabilities in runtime dependencies fail the release
    - uv export --frozen --no-dev --format requirements-txt --no-emit-project > /tmp/requirements.txt
    - uvx pip-audit --strict -r /tmp/requirements.txt

validate:sast:
  extends: .python
  stage: validate
  script:
    # static analysis of the code (issue 395): a high-severity finding fails the release
    - uvx bandit -q -r src -lll -ii
    # no source file may hide bidirectional control characters (Trojan Source, CVE-2021-42574)
    - |
      if grep -rlP --exclude-dir=__pycache__ --exclude-dir=node_modules '[\x{202A}-\x{202E}\x{2066}-\x{2069}]' src ../frontend/src; then
        echo "bidirectional control characters in the files above: write them as escapes"; exit 1
      fi
    # Semgrep (OWASP Top 10, FastAPI, React): reported while its known findings are triaged (issue 396)
    - >
      uvx semgrep scan --metrics=off --error --severity ERROR --severity WARNING
      --config p/python --config p/fastapi --config p/typescript --config p/react --config p/owasp-top-ten
      --json-output=$CI_PROJECT_DIR/semgrep.json src ../frontend/src
  artifacts:
    when: always
    paths:
      - semgrep.json
    expire_in: 30 days
  allow_failure:
    exit_codes: [1]

validate:dockerfile:
  stage: validate
  image:
    name: hadolint/hadolint:v2.12.0-debian
    entrypoint: [""]
  script:
    # issue 399: the Dockerfile's practices (reviewed exceptions in .hadolint.yaml)
    - hadolint --config portalab/deploy/.hadolint.yaml portalab/deploy/Dockerfile

validate:docker-config:
  stage: validate
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  script:
    # issue 399: misconfigurations of the image's recipe (root user, secrets, healthcheck…) fail the release;
    # the Compose file's hardening is held by tests/boundary/test_compose_hardening.py
    - trivy config --quiet --severity HIGH,CRITICAL --exit-code 1 portalab/deploy

validate:dead-code:
  extends: .python
  stage: validate
  script:
    # unused functions, classes, variables, unreachable code (issue 397); false positives in the whitelist
    - uvx vulture==2.16 src vulture_whitelist.py --min-confidence 80

validate:biome:
  extends: .node
  stage: validate
  script:
    - npx biome ci . --diagnostic-level=error

validate:typescript:
  extends: .node
  stage: validate
  script:
    - npm run typecheck

validate:api-drift:
  extends: .node
  stage: validate
  script:
    - npm run check:api-drift

validate:i18n-frontend:
  extends: .node
  stage: validate
  script:
    - npm run i18n:check

validate:knip:
  extends: .node
  stage: validate
  script:
    # unused files, exports and dependencies of the interface: reported until they are cleaned (issue 397)
    - npx --yes knip@5.88.1 --no-progress
  allow_failure:
    exit_codes: [1]

validate:node-audit:
  extends: .node
  stage: validate
  script:
    - npm audit --omit=dev --audit-level=high

validate:secrets:
  stage: validate
  image:
    name: zricethezav/gitleaks:v8.21.2
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    # reviewed false positives are listed in .gitleaksignore
    - gitleaks detect --source "$CI_PROJECT_DIR" --no-banner --redact --verbose

# =============================================================================
# Stage: test
# =============================================================================
# The runner shares its machine with GitLab and Ollama (4 cores, ~8 GB left): the test jobs run one after the
# other (``needs``), each with bounded workers and memory — together they once froze the machine.
test:backend:
  extends: .python
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
      # disposable test database: durability off makes per-test CREATE DATABASE … TEMPLATE fast
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off",
                "-c", "max_connections=300"]
  variables:
    PORTALAB_TEST_DATABASE_URL: "postgresql://portalab@postgres:5432/portalab_ci"
    PORTALAB_REQUIRE_DB: "1"
  script:
    # unit + contract + security + integration (real PostgreSQL, migrations from scratch and upgrade)
    - uv run pytest -n 2 --dist loadfile --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: portalab/backend/report.xml
    expire_in: 1 week
  rules:
    - if: '$ENABLE_BACKEND_TESTS == "true"'

test:backend-semantic-search:
  # semantic retrieval needs pgvector, absent from the default image (those tests skip there)
  extends: .python
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
      command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "max_connections=100"]
  variables:
    PORTALAB_TEST_DATABASE_URL: "postgresql://portalab@postgres:5432/portalab_ci"
    PORTALAB_REQUIRE_DB: "1"
  needs: [{ job: "test:backend", artifacts: false, optional: true }]
  script:
    - uv run pytest tests/integration/search/test_semantic.py
  rules:
    - if: '$ENABLE_BACKEND_TESTS == "true"'

test:frontend:
  extends: .node
  stage: test
  needs: [{ job: "test:backend-semantic-search", artifacts: false, optional: true }]
  variables:
    NODE_OPTIONS: "--max-old-space-size=3072"
  script:
    # unit + accessibility (axe, WCAG 2.2 AA token contrast) — Vitest
    - npx vitest run --maxWorkers=2 --reporter=default --reporter=junit --outputFile.junit=report.xml
    # the production bundle builds
    - npm run build
  artifacts:
    when: always
    reports:
      junit: portalab/frontend/report.xml
    expire_in: 1 week
  rules:
    - if: '$ENABLE_FRONTEND_TESTS == "true"'

test:frontend-a11y:
  # axe on the component gallery (every theme), keyboard-only journey, 320 px reflow and text spacing —
  # Playwright against the Vite dev server with a stubbed API
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  stage: test
  needs: [{ job: "test:frontend", artifacts: false, optional: true }]
  variables:
    NODE_OPTIONS: "--max-old-space-size=2048"
  before_script:
    - cd portalab/frontend
    - npm ci --no-audit --no-fund
  script:
    - npx playwright test --workers=1
  artifacts:
    when: on_failure
    paths: [portalab/frontend/test-results/]
    expire_in: 1 week
  rules:
    - if: '$ENABLE_FRONTEND_TESTS == "true"'

# =============================================================================
# Stage: build — the image builds, and starts
# =============================================================================
# The image is not exported as an artifact (it is far over GitLab's artifact limit): the publish and deploy
# jobs build it again in their own dind.
build:docker:
  extends: .docker
  stage: build
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHA} \
        --build-arg VERSION=${CI_COMMIT_TAG#v} \
        --tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} \
        --file ${DOCKERFILE} \
        .
    # one image, three entrypoints (serve, worker, migrate): it starts
    - docker run --rm ${DOCKER_IMAGE}:${CI_COMMIT_SHA} --help
    # issue 395: a fixed HIGH or CRITICAL vulnerability in the image (system packages, Python, Node) fails it
    - |
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image \
        --quiet --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
        ${DOCKER_IMAGE}:${CI_COMMIT_SHA}
  rules:
    - if: '$ENABLE_DOCKER_BUILD == "true"'

# =============================================================================
# Stage: publish — GitLab Container Registry (optional)
# =============================================================================
publish:gitlab-registry:
  extends: .docker
  stage: publish
  variables:
    DOCKER_BUILDKIT: 1
  script:
    - |
      docker build \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHA} \
        --build-arg VERSION=${CI_COMMIT_TAG#v} \
        --tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} \
        --file ${DOCKERFILE} \
        .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
    - docker tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} ${CI_REGISTRY_IMAGE}:latest
    - docker push ${CI_REGISTRY_IMAGE}:${CI_COMMIT_TAG}
    - docker push ${CI_REGISTRY_IMAGE}:latest
  rules:
    - if: '$ENABLE_GITLAB_REGISTRY == "true" && $ENABLE_DOCKER_BUILD == "true"'

# =============================================================================
# Stage: deploy — Docker Hub + GitHub mirror
# =============================================================================
deploy:
  extends: .docker
  stage: deploy
  variables:
    DOCKER_BUILDKIT: 1
    GIT_DEPTH: 0  # the whole history goes to GitHub
  before_script:
    - apk add --no-cache git curl jq
    - git fetch --unshallow || true
    - until docker info >/dev/null 2>&1; do sleep 1; done
  script:
    - |
      if [ "$DOCKER_HUB_ENABLED" = "true" ]; then
        echo "Building the image ${CI_COMMIT_TAG}..."
        docker build \
          --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
          --build-arg VCS_REF=${CI_COMMIT_SHA} \
          --build-arg VERSION=${CI_COMMIT_TAG#v} \
          --tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} \
          --file ${DOCKERFILE} \
          .
        echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USER" --password-stdin
        DOCKER_HUB_IMAGE="${DOCKER_HUB_USER}/${CI_PROJECT_NAME}"
        for TAG in "${CI_COMMIT_TAG}" "${CI_COMMIT_TAG#v}" latest; do
          docker tag ${DOCKER_IMAGE}:${CI_COMMIT_SHA} ${DOCKER_HUB_IMAGE}:${TAG}
          docker push ${DOCKER_HUB_IMAGE}:${TAG}
        done
        # the Docker Hub page is portalab/deploy/DOCKERHUB.md
        if [ -f portalab/deploy/DOCKERHUB.md ]; then
          wget -q https://github.com/christian-korneck/docker-pushrm/releases/download/v1.9.0/docker-pushrm_linux_amd64 -O /usr/local/bin/docker-pushrm
          chmod +x /usr/local/bin/docker-pushrm
          docker-pushrm --file portalab/deploy/DOCKERHUB.md \
            --short "The self-hosted portal for your community: media, cards, games, wiki and more." \
            "${DOCKER_HUB_IMAGE}" || echo "Docker Hub README not updated"
        fi
      fi
    - |
      if [ "$GITHUB_DEPLOY_ENABLED" = "true" ]; then
        echo "Mirroring ${CI_COMMIT_TAG} and the default branch to GitHub..."
        git remote add github "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" || true
        git push github HEAD:refs/heads/${CI_DEFAULT_BRANCH} --force
        git push github refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG} --force
      fi
  rules:
    - if: '$DEPLOY == "true"'

# =============================================================================
# Stage: release — GitLab and GitHub releases, from GITHUB_RELEASES.md
# =============================================================================
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  before_script:
    - apk add --no-cache sed gawk
  script:
    - *release_notes
    - |
      printf '\n---\n[Full changelog](%s/-/blob/%s/CHANGELOG.md)\n' "$CI_PROJECT_URL" "$CI_COMMIT_TAG" >> /tmp/release_notes.md
      release-cli create \
        --name "Portalab ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "$(cat /tmp/release_notes.md)"

release:github:
  stage: release
  image: alpine:latest
  needs:
    - job: deploy
      optional: true
  before_script:
    - apk add --no-cache curl jq gawk sed
  script:
    - *release_notes
    - |
      RESPONSE=$(curl -X POST \
        -H "Authorization: token ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github.v3+json" \
        -H "Content-Type: application/json" \
        -s -w "\n%{http_code}" \
        "https://api.github.com/repos/${GITHUB_REPO}/releases" \
        -d "$(jq -n \
          --arg tag "${CI_COMMIT_TAG}" \
          --arg name "Portalab ${CI_COMMIT_TAG}" \
          --rawfile body /tmp/release_notes.md \
          '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
      BODY=$(echo "$RESPONSE" | sed '$d')
      if [ "$HTTP_CODE" -eq 201 ]; then
        echo "GitHub release created: $(echo "$BODY" | jq -r '.html_url')"
      else
        echo "GitHub release failed (HTTP $HTTP_CODE)"
        echo "$BODY" | jq '.' || echo "$BODY"
        exit 1
      fi
  rules:
    - if: '$DEPLOY == "true" && $GITHUB_DEPLOY_ENABLED == "true"'

# =============================================================================
# Stage: verify — what was published is there
# =============================================================================
verify:
  stage: verify
  image: alpine:latest
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      if [ "$DOCKER_HUB_ENABLED" = "true" ]; then
        DOCKER_HUB_IMAGE="${DOCKER_HUB_USER}/${CI_PROJECT_NAME}"
        FOUND=false
        for i in 1 2 3 4 5; do
          if curl -s "https://hub.docker.com/v2/repositories/${DOCKER_HUB_IMAGE}/tags/${CI_COMMIT_TAG}" | jq -e '.name' >/dev/null 2>&1; then
            echo "Docker Hub: ${DOCKER_HUB_IMAGE}:${CI_COMMIT_TAG} is there"; FOUND=true; break
          fi
          echo "Docker Hub: not yet ($i/5)"; sleep 15
        done
        [ "$FOUND" = "true" ] || { echo "Docker Hub: ${DOCKER_HUB_IMAGE}:${CI_COMMIT_TAG} missing"; exit 1; }
      fi
    - |
      if [ "$GITHUB_DEPLOY_ENABLED" = "true" ]; then
        for i in 1 2 3 4 5; do
          RESPONSE=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPO}/releases/tags/${CI_COMMIT_TAG}")
          if echo "$RESPONSE" | jq -e '.id' >/dev/null 2>&1; then
            echo "GitHub release: $(echo "$RESPONSE" | jq -r '.html_url')"; exit 0
          fi
          echo "GitHub release: not yet ($i/5)"; sleep 10
        done
        echo "GitHub release ${CI_COMMIT_TAG} not found (it may still appear)"
      fi
  rules:
    - if: '$DEPLOY == "true"'
