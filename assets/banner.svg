<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <title>Portalab — the self-hosted portal for your community</title>
  <!-- palette: Portalab's default theme (portalab-dark) — see assets/README.md -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b2b"/>
      <stop offset="0.6" stop-color="#0b0e17"/>
      <stop offset="1" stop-color="#0b0e17"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#3a55d0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3a55d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.92" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef1f8"/>
      <stop offset="1" stop-color="#a3b8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glowL)"/>
  <rect width="1280" height="400" fill="url(#glowR)"/>
  <!-- the icon -->
  <image href="icon.svg" x="96" y="80" width="240" height="240"/>
  <!-- the words -->
  <text x="392" y="182" font-family="Plus Jakarta Sans, Ubuntu Sans, sans-serif" font-weight="800" font-size="92"
        letter-spacing="-2" fill="url(#word)">Portalab</text>
  <text x="396" y="232" font-family="Plus Jakarta Sans, Ubuntu Sans, sans-serif" font-weight="500" font-size="27"
        fill="#a9b2c7">The self-hosted portal for your community, on your own server.</text>
  <!-- what it gathers -->
  <g font-family="Plus Jakarta Sans, Ubuntu Sans, sans-serif" font-weight="600" font-size="19" fill="#eef1f8">
    <g transform="translate(396 268)">
      <rect width="96" height="40" rx="20" fill="#161b2b" stroke="#2b3349" stroke-width="1.5"/>
      <text x="48" y="26.5" text-anchor="middle">Media</text>
    </g>
    <g transform="translate(504 268)">
      <rect width="88" height="40" rx="20" fill="#161b2b" stroke="#2b3349" stroke-width="1.5"/>
      <text x="44" y="26.5" text-anchor="middle">Cards</text>
    </g>
    <g transform="translate(604 268)">
      <rect width="96" height="40" rx="20" fill="#161b2b" stroke="#2b3349" stroke-width="1.5"/>
      <text x="48" y="26.5" text-anchor="middle">Games</text>
    </g>
    <g transform="translate(712 268)">
      <rect width="76" height="40" rx="20" fill="#161b2b" stroke="#2b3349" stroke-width="1.5"/>
      <text x="38" y="26.5" text-anchor="middle">Wiki</text>
    </g>
    <g transform="translate(800 268)">
      <rect width="90" height="40" rx="20" fill="#161b2b" stroke="#2b3349" stroke-width="1.5"/>
      <text x="45" y="26.5" text-anchor="middle">Radio</text>
    </g>
    <g transform="translate(902 268)">
      <rect width="130" height="40" rx="20" fill="#161b2b" stroke="#2b3349" stroke-width="1.5"/>
      <text x="65" y="26.5" text-anchor="middle">Community</text>
    </g>
    <g transform="translate(1044 268)">
      <rect width="96" height="40" rx="20" fill="#ffb547" fill-opacity="0.12" stroke="#ffb547" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="48" y="26.5" text-anchor="middle" fill="#ffb547">+ more</text>
    </g>
  </g>
</svg>
