; Architecture boundaries — specs/001-portal-global-spec/contracts/module-boundaries.md
; Layers (outer may import inner, never the reverse):
;   app  >  plugins_runtime  >  modules | connectors  >  sdk  >  capabilities  >  core
; Plugins (outside this package) may import only ``portalab.sdk`` — enforced by the 023 import scanner.
; `modules` and `connectors` are independent siblings (connectors never import modules and vice versa).
; Mutual independence of individual modules is enforced dynamically by tests/boundary/test_boundaries.py,
; because the module list grows with each spec.

[importlinter]
root_package = portalab
include_external_packages = True

[importlinter:contract:layers]
name = Layered architecture (core <- capabilities <- modules|connectors <- app)
type = layers
layers =
    portalab.app
    portalab.plugins_runtime
    portalab.modules | portalab.connectors
    portalab.sdk
    portalab.capabilities
    portalab.core

[importlinter:contract:core-no-plugins]
name = Core never imports the plugin runtime or the composition root
type = forbidden
source_modules =
    portalab.core
    portalab.capabilities
    portalab.sdk
forbidden_modules =
    portalab.plugins_runtime
    portalab.app
    portalab.modules

[importlinter:contract:identity-crypto-imaging]
name = Password hashing (argon2) and image decoding (Pillow) stay in their owners (identity, media, the shared upload helper)
type = forbidden
source_modules =
    portalab.app
    portalab.core
    portalab.capabilities
    portalab.connectors
    portalab.plugins_runtime
forbidden_modules =
    argon2
    PIL
allow_indirect_imports = True
; spec 011 T007 / F10: the upload sniff/re-encode helper shared by content (011) and support (016) lives in core
ignore_imports =
    portalab.core.uploads -> PIL
