[project]
name = "portalab"
version = "0.1.0"
description = "Personal extensible portal — backend (modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "uuid6>=2024.7.10",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "pillow>=11",
    "babel>=2.16",
    "tzdata>=2025.2",
    "jsonschema>=4.23",
    "aiosmtplib>=3.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "nh3>=0.3.7",
    "diff-match-patch>=20241021",
]

[project.scripts]
portalab = "portalab.app.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "pytest-xdist>=3.8.0",
    "types-jsonschema>=4.26.0.20260518",
    "aiosmtpd>=1.4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/portalab"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PTH", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are immutable declarations, not calls evaluated per request
extend-immutable-calls = ["fastapi.Depends", "portalab.core.authorization.require"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S104", "S105", "S106", "S608"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["portalab"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["portalab.core.*", "portalab.capabilities.*"]
strict = true

[[tool.mypy.overrides]]
module = ["uuid6", "asyncpg", "asyncpg.*", "diff_match_patch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "unit: pure logic, no I/O",
    "integration: requires PostgreSQL (PORTALAB_TEST_DATABASE_URL)",
    "contract: capability/API contract tests",
    "boundary: architecture boundary checks",
]
addopts = "-ra --strict-markers"
