; Alembic configuration for Portalab. script_location and version_locations are set programmatically by
; portalab.app.migrations.alembic_config (module-contributed locations); the database URL comes from the
; bootstrap settings (DATABASE_URL_FILE), never from this file.
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
path_separator = space
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
truncate_slug_length = 60

[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =
